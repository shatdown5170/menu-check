<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>메뉴 설명 조회</title>
<style>
  :root{
    color-scheme: light only;
    --ink:#37352F; --gray:#9B9A97; --gray2:#787774;
    --line:#EAE9E5; --line2:#EDEDEC; --bg:#F7F6F3; --card:#FFFFFF; --hover:#EFEEEA;
    --pill:#EDECE8; --pill-on:#E3E2DD;
    --blue:#2383E2; --blue-soft:#E7F1FB;
    --green-bg:#DBEDDB; --green-fg:#448361;
    --radius:12px;
  }
  @media (prefers-color-scheme: dark){
    html,body{background:#F7F6F3 !important;color:#37352F !important;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Pretendard",Roboto,"Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{line-height:1.5;max-width:680px;margin:0 auto;}

  .top{position:sticky;top:0;z-index:10;background:rgba(247,246,243,.92);backdrop-filter:saturate(180%) blur(14px);
    padding:18px 20px 14px;border-bottom:1px solid var(--line2);}
  .top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-0.5px;display:flex;align-items:center;gap:8px;}
  .top p{margin:4px 0 0;font-size:13.5px;color:var(--gray);}

  .wrap{padding:16px 20px 140px;}

  /* ── 비밀번호 게이트 ── */
  #gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px;}
  #gate.show{display:flex;}
  .gate-box{width:100%;max-width:340px;text-align:center;}
  .gate-box .emoji{font-size:44px;}
  .gate-box h2{margin:12px 0 4px;font-size:20px;font-weight:800;}
  .gate-box p{margin:0 0 20px;font-size:14px;color:var(--gray2);}
  .gate-box input{width:100%;padding:14px 16px;font-size:17px;border:1.5px solid var(--line);border-radius:var(--radius);
    background:var(--card);text-align:center;letter-spacing:2px;outline:none;}
  .gate-box input:focus{border-color:var(--blue);}
  .gate-box button{width:100%;margin-top:12px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:var(--ink);
    border:none;border-radius:var(--radius);cursor:pointer;}
  .gate-err{margin-top:10px;font-size:13.5px;color:#D9730D;min-height:20px;}

  /* ── 검색 ── */
  .search{position:relative;margin-bottom:14px;}
  .search input{width:100%;padding:13px 16px 13px 42px;font-size:16px;border:1.5px solid var(--line);border-radius:var(--radius);
    background:var(--card);outline:none;}
  .search input:focus{border-color:var(--blue);}
  .search .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--gray);}
  .meta-line{font-size:12.5px;color:var(--gray);margin:0 2px 10px;}

  /* ── 스토어 목록 ── */
  .store-item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;
    display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s;}
  .store-item:active{background:var(--hover);}
  .store-item .info{flex:1;min-width:0;}
  .store-item .name{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .store-item .sub{font-size:12.5px;color:var(--gray);margin-top:2px;}
  .store-item .arrow{color:var(--gray);font-size:18px;}
  .empty{text-align:center;padding:60px 20px;color:var(--gray);font-size:14.5px;}
  .empty .emoji{font-size:40px;display:block;margin-bottom:10px;}

  /* ── 스토어 상세 ── */
  #detail{display:none;}
  #detail.show{display:block;}
  #list-view.hide{display:none;}
  .back-btn{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;font-weight:600;color:var(--gray2);
    background:var(--pill);border:none;border-radius:99px;padding:8px 16px 8px 12px;cursor:pointer;margin-bottom:14px;}
  .store-head{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  .store-head h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-0.4px;}
  .store-head .sub{font-size:13px;color:var(--gray);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 12px;}
  .menu-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px;}
  .menu-card .m-name{font-size:16px;font-weight:700;display:flex;gap:8px;}
  .menu-card .m-name .num{color:var(--gray);font-weight:600;flex-shrink:0;}
  .menu-card .m-desc{font-size:14.5px;color:var(--gray2);margin-top:8px;white-space:pre-wrap;word-break:break-word;}

  /* ── 하단 액션 바 ── */
  .action-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;gap:10px;padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:rgba(247,246,243,.92);backdrop-filter:saturate(180%) blur(14px);border-top:1px solid var(--line2);
    max-width:680px;margin:0 auto;}
  .action-bar.show{display:flex;}
  .action-bar button{flex:1;padding:15px 8px;font-size:15.5px;font-weight:700;border:none;border-radius:var(--radius);cursor:pointer;}
  .btn-copy{background:var(--pill-on);color:var(--ink);}
  .btn-img{background:var(--ink);color:#fff;}
  .action-bar button:disabled{opacity:.5;}

  /* ── 토스트 ── */
  #toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);z-index:200;
    background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:11px 20px;border-radius:99px;
    opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ── 이미지 결과 모달 ── */
  #img-modal{position:fixed;inset:0;z-index:150;background:rgba(55,53,47,.45);display:none;align-items:flex-end;justify-content:center;}
  #img-modal.show{display:flex;}
  .modal-sheet{background:var(--bg);width:100%;max-width:680px;max-height:88vh;border-radius:18px 18px 0 0;
    display:flex;flex-direction:column;overflow:hidden;}
  .modal-head{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line2);}
  .modal-head h3{margin:0;font-size:17px;font-weight:800;}
  .modal-head button{background:var(--pill);border:none;border-radius:99px;width:32px;height:32px;font-size:15px;cursor:pointer;color:var(--gray2);}
  .modal-body{overflow-y:auto;padding:16px 20px calc(20px + env(safe-area-inset-bottom));}
  .modal-tip{font-size:12.5px;color:var(--gray);background:var(--pill);border-radius:8px;padding:10px 12px;margin-bottom:14px;}
  .img-page{margin-bottom:18px;}
  .img-page .pg-label{font-size:13px;font-weight:700;color:var(--gray2);margin-bottom:6px;}
  .img-page img{width:100%;border:1px solid var(--line);border-radius:10px;display:block;}
  .img-page .pg-btns{display:flex;gap:8px;margin-top:8px;}
  .img-page .pg-btns button{flex:1;padding:11px;font-size:14px;font-weight:700;border:none;border-radius:10px;cursor:pointer;}
  .pg-dl{background:var(--ink);color:#fff;}
  .pg-share{background:var(--pill-on);color:var(--ink);}

  /* ── 로딩 오버레이 ── */
  #busy{position:fixed;inset:0;z-index:180;background:rgba(247,246,243,.75);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
  #busy.show{display:flex;}
  .spinner{width:34px;height:34px;border:3.5px solid var(--pill-on);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #busy .msg{font-size:14.5px;font-weight:600;color:var(--gray2);}

  .loading-center{text-align:center;padding:70px 20px;color:var(--gray);}
</style>
</head>
<body>

<!-- 비밀번호 게이트 -->
<div id="gate">
  <div class="gate-box">
    <div class="emoji">🔐</div>
    <h2>메뉴 설명 조회</h2>
    <p>접속 비밀번호를 입력해주세요</p>
    <input id="gate-input" type="password" inputmode="text" autocomplete="off" placeholder="비밀번호">
    <button id="gate-btn">확인</button>
    <div class="gate-err" id="gate-err"></div>
  </div>
</div>

<div class="top">
  <h1>🍽️ 메뉴 설명 조회</h1>
  <p>스토어를 검색하고, 메뉴 설명을 이미지·텍스트로 저장하세요</p>
</div>

<div class="wrap">
  <!-- 목록 화면 -->
  <div id="list-view">
    <div class="search">
      <span class="icon">🔍</span>
      <input id="search-input" type="search" placeholder="스토어 ID 또는 상호명 검색" autocomplete="off">
    </div>
    <div class="meta-line" id="meta-line"></div>
    <div id="store-list"><div class="loading-center">데이터를 불러오는 중…</div></div>
  </div>

  <!-- 상세 화면 -->
  <div id="detail">
    <button class="back-btn" id="back-btn">‹ 목록으로</button>
    <div class="store-head">
      <h2 id="d-name"></h2>
      <div class="sub" id="d-sub"></div>
    </div>
    <div id="d-menus"></div>
  </div>
</div>

<!-- 하단 액션 바 (상세 화면에서만) -->
<div class="action-bar" id="action-bar">
  <button class="btn-copy" id="btn-copy">📋 텍스트 복사</button>
  <button class="btn-img" id="btn-img">📷 이미지 저장</button>
</div>

<!-- 이미지 결과 모달 -->
<div id="img-modal">
  <div class="modal-sheet">
    <div class="modal-head">
      <h3 id="modal-title">이미지 저장</h3>
      <button id="modal-close">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div id="busy"><div class="spinner"></div><div class="msg" id="busy-msg">처리 중…</div></div>
<div id="toast"></div>

<script>
/* ═══════════ 설정 ═══════════ */
const SERVER_URL = "https://menu-check-564449764059.asia-northeast3.run.app";
const KEY_STORAGE = "md_access_key";

/* ═══════════ 상태 ═══════════ */
let stores = [];          // [{id,name,updatedAt,menus:[{name,desc}]}]
let currentStore = null;
let objectUrls = [];      // 모달 닫을 때 해제

const $ = (id)=>document.getElementById(id);

function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}
function busy(on, msg){
  $("busy").classList.toggle("show", !!on);
  if(msg) $("busy-msg").textContent = msg;
}

/* ═══════════ 인증 ═══════════ */
function getKey(){ return localStorage.getItem(KEY_STORAGE) || ""; }

async function verifyKey(key){
  const r = await fetch(SERVER_URL + "/menu-desc/ping", { headers: { "x-access-key": key } });
  return r.ok;
}

async function gateSubmit(){
  const key = $("gate-input").value.trim();
  if(!key) return;
  $("gate-err").textContent = "";
  busy(true, "확인 중…");
  try{
    if(await verifyKey(key)){
      localStorage.setItem(KEY_STORAGE, key);
      $("gate").classList.remove("show");
      loadData();
    }else{
      $("gate-err").textContent = "비밀번호가 올바르지 않습니다.";
    }
  }catch(e){
    $("gate-err").textContent = "서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.";
  }finally{
    busy(false);
  }
}
$("gate-btn").addEventListener("click", gateSubmit);
$("gate-input").addEventListener("keydown", e=>{ if(e.key==="Enter") gateSubmit(); });

/* ═══════════ 데이터 로드 ═══════════ */
async function loadData(){
  $("store-list").innerHTML = '<div class="loading-center">데이터를 불러오는 중…</div>';
  try{
    const r = await fetch(SERVER_URL + "/menu-desc/data", { headers: { "x-access-key": getKey() } });
    if(r.status === 401){
      localStorage.removeItem(KEY_STORAGE);
      $("gate").classList.add("show");
      return;
    }
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || "HTTP " + r.status);
    stores = (data.stores || []).sort((a,b)=> (b.updatedAt||"").localeCompare(a.updatedAt||""));
    renderList();
  }catch(e){
    $("store-list").innerHTML = '<div class="empty"><span class="emoji">⚠️</span>불러오기 실패: ' + escapeHtml(String(e.message||e)) + '<br><br><button class="back-btn" onclick="loadData()">다시 시도</button></div>';
  }
}

/* ═══════════ 목록 & 검색 ═══════════ */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderList(){
  const q = $("search-input").value.trim().toLowerCase();
  const filtered = q
    ? stores.filter(s => s.id.toLowerCase().includes(q) || (s.name||"").toLowerCase().includes(q))
    : stores;

  $("meta-line").textContent = q
    ? `검색 결과 ${filtered.length}개 스토어`
    : `총 ${stores.length}개 스토어`;

  if(filtered.length === 0){
    $("store-list").innerHTML = stores.length === 0
      ? '<div class="empty"><span class="emoji">📭</span>아직 업로드된 데이터가 없습니다</div>'
      : '<div class="empty"><span class="emoji">🔍</span>검색 결과가 없습니다</div>';
    return;
  }
  $("store-list").innerHTML = filtered.slice(0, 200).map((s,i)=>`
    <div class="store-item" data-id="${escapeHtml(s.id)}">
      <div class="info">
        <div class="name">${escapeHtml(s.name || "(상호명 없음)")}</div>
        <div class="sub">ID ${escapeHtml(s.id)} · 메뉴 ${s.menus.length}개${s.updatedAt ? " · " + escapeHtml(s.updatedAt.slice(0,10)) : ""}</div>
      </div>
      <div class="arrow">›</div>
    </div>`).join("");
  $("store-list").querySelectorAll(".store-item").forEach(el=>{
    el.addEventListener("click", ()=>openDetail(el.dataset.id));
  });
}
$("search-input").addEventListener("input", renderList);

/* ═══════════ 상세 ═══════════ */
function openDetail(id){
  currentStore = stores.find(s=>s.id===id);
  if(!currentStore) return;
  $("d-name").textContent = currentStore.name || "(상호명 없음)";
  $("d-sub").innerHTML =
    `<span>스토어 ID <b>${escapeHtml(currentStore.id)}</b></span>` +
    `<span>메뉴 ${currentStore.menus.length}개</span>` +
    (currentStore.updatedAt ? `<span>업데이트 ${escapeHtml(currentStore.updatedAt.slice(0,10))}</span>` : "");
  $("d-menus").innerHTML = currentStore.menus.map((m,i)=>`
    <div class="menu-card">
      <div class="m-name"><span class="num">${i+1}.</span><span>${escapeHtml(m.name)}</span></div>
      ${m.desc ? `<div class="m-desc">${escapeHtml(m.desc)}</div>` : ""}
    </div>`).join("");
  $("list-view").classList.add("hide");
  $("detail").classList.add("show");
  $("action-bar").classList.add("show");
  window.scrollTo(0,0);
}
$("back-btn").addEventListener("click", ()=>{
  $("detail").classList.remove("show");
  $("action-bar").classList.remove("show");
  $("list-view").classList.remove("hide");
  currentStore = null;
});

/* ═══════════ 텍스트 복사 ═══════════ */
function buildText(store){
  const lines = [];
  lines.push(`■ ${store.name || "(상호명 없음)"} (스토어 ID: ${store.id})`);
  lines.push(`메뉴 설명 ${store.menus.length}개${store.updatedAt ? " · 업데이트 " + store.updatedAt.slice(0,10) : ""}`);
  lines.push("");
  store.menus.forEach((m,i)=>{
    lines.push(`${i+1}. ${m.name}`);
    if(m.desc) lines.push(m.desc);
    lines.push("");
  });
  return lines.join("\n").trim();
}

$("btn-copy").addEventListener("click", async ()=>{
  if(!currentStore) return;
  const text = buildText(currentStore);
  try{
    await navigator.clipboard.writeText(text);
    toast("📋 전체 메뉴 설명이 복사되었습니다");
  }catch(e){
    // 구형/제한 환경 폴백
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;left:-9999px;top:0;";
    document.body.appendChild(ta);
    ta.select();
    try{
      document.execCommand("copy");
      toast("📋 전체 메뉴 설명이 복사되었습니다");
    }catch(e2){
      toast("복사에 실패했습니다");
    }
    ta.remove();
  }
});

/* ═══════════ 이미지 생성 (캔버스 직접 렌더링) ═══════════
   화면을 캡처하는 대신, 스토어 전체 내용을 캔버스에 직접 그려서
   스크롤과 무관하게 전체가 담긴 세로로 긴 PNG를 만든다.
   기기 캔버스 한계를 넘으면 메뉴 카드 경계에서 자동 분할. */
const IMG_W = 1080;
const IMG_PAD = 56;
const CARD_PAD = 40;
const CARD_GAP = 24;
const MAX_PAGE_H = 11000; // iOS 사파리 캔버스 면적 한계(약 1,678만px) 안쪽으로 유지

const FONT_STACK = '-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const F_TITLE  = '800 46px ' + FONT_STACK;
const F_SUB    = '400 27px ' + FONT_STACK;
const F_MNAME  = '700 34px ' + FONT_STACK;
const F_MDESC  = '400 29px ' + FONT_STACK;
const F_FOOT   = '400 23px ' + FONT_STACK;
const LH_MNAME = 48, LH_MDESC = 46;

function wrapText(ctx, text, font, maxW){
  ctx.font = font;
  const out = [];
  for(const para of String(text).split("\n")){
    if(para === ""){ out.push(""); continue; }
    let line = "";
    for(const word of para.split(" ")){
      const tryLine = line ? line + " " + word : word;
      if(ctx.measureText(tryLine).width <= maxW){
        line = tryLine;
        continue;
      }
      if(line) out.push(line);
      // 단어 하나가 폭을 넘으면(긴 한글 문장 등) 글자 단위로 쪼갬
      if(ctx.measureText(word).width > maxW){
        let chunk = "";
        for(const ch of word){
          if(ctx.measureText(chunk + ch).width > maxW){ out.push(chunk); chunk = ch; }
          else chunk += ch;
        }
        line = chunk;
      }else{
        line = word;
      }
    }
    out.push(line);
  }
  return out;
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function buildImagePages(store){
  const measure = document.createElement("canvas").getContext("2d");
  const innerW = IMG_W - IMG_PAD*2;
  const cardInnerW = innerW - CARD_PAD*2;

  // 메뉴 카드들을 (필요시 설명을 쪼개가며) 블록으로 변환
  const blocks = [];
  store.menus.forEach((m, i)=>{
    const nameLines = wrapText(measure, `${i+1}. ${m.name}`, F_MNAME, cardInnerW);
    const descLines = m.desc ? wrapText(measure, m.desc, F_MDESC, cardInnerW) : [];
    const makeBlock = (nl, dl, cont)=>({
      nameLines: nl, descLines: dl, cont,
      h: CARD_PAD*2 + nl.length*LH_MNAME + (dl.length ? 14 + dl.length*LH_MDESC : 0),
    });
    const maxCardH = MAX_PAGE_H - IMG_PAD*2 - 200;
    let block = makeBlock(nameLines, descLines, false);
    if(block.h <= maxCardH){
      blocks.push(block);
    }else{
      // 카드 하나가 페이지보다 크면 설명 줄을 나눠 '(이어서)' 카드로 분할
      const headH = CARD_PAD*2 + nameLines.length*LH_MNAME + 14;
      const perPage = Math.max(5, Math.floor((maxCardH - headH) / LH_MDESC));
      for(let s=0; s<descLines.length; s+=perPage){
        blocks.push(makeBlock(
          s===0 ? nameLines : wrapText(measure, `${i+1}. ${m.name} (이어서)`, F_MNAME, cardInnerW),
          descLines.slice(s, s+perPage), s>0));
      }
    }
  });

  // 헤더 높이 계산
  const titleLines = wrapText(measure, store.name || "(상호명 없음)", F_TITLE, innerW);
  const headerH = titleLines.length*62 + 44 + 30; // 제목 + 부제 + 여백
  const FOOT_H = 70;

  // 페이지 배분: 카드 경계에서 끊음
  const pages = [];
  let cur = [], curH = IMG_PAD + headerH + 24;
  for(const b of blocks){
    if(cur.length && curH + b.h + CARD_GAP > MAX_PAGE_H - IMG_PAD - FOOT_H){
      pages.push(cur);
      cur = [];
      curH = IMG_PAD + headerH + 24;
    }
    cur.push(b);
    curH += b.h + CARD_GAP;
  }
  if(cur.length) pages.push(cur);
  if(pages.length === 0) pages.push([]);

  // 각 페이지 렌더링
  const now = new Date();
  const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  return pages.map((pageBlocks, pi)=>{
    const contentH = pageBlocks.reduce((a,b)=>a + b.h + CARD_GAP, 0);
    const H = IMG_PAD + headerH + 24 + contentH + FOOT_H + IMG_PAD;
    const canvas = document.createElement("canvas");
    canvas.width = IMG_W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#F7F6F3";
    ctx.fillRect(0, 0, IMG_W, H);
    ctx.textBaseline = "top";

    // 헤더
    let y = IMG_PAD;
    ctx.fillStyle = "#37352F";
    ctx.font = F_TITLE;
    for(const ln of titleLines){ ctx.fillText(ln, IMG_PAD, y); y += 62; }
    ctx.fillStyle = "#787774";
    ctx.font = F_SUB;
    const subParts = [`스토어 ID ${store.id}`, `메뉴 ${store.menus.length}개`];
    if(store.updatedAt) subParts.push(`업데이트 ${store.updatedAt.slice(0,10)}`);
    if(pages.length > 1) subParts.push(`${pi+1} / ${pages.length} 페이지`);
    ctx.fillText(subParts.join("  ·  "), IMG_PAD, y + 6);
    y += 44;
    ctx.strokeStyle = "#EAE9E5";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(IMG_PAD, y+16); ctx.lineTo(IMG_W-IMG_PAD, y+16); ctx.stroke();
    y += 30 + 24;

    // 메뉴 카드
    for(const b of pageBlocks){
      ctx.fillStyle = "#FFFFFF";
      ctx.strokeStyle = "#EAE9E5";
      ctx.lineWidth = 2;
      roundRect(ctx, IMG_PAD, y, innerW, b.h, 18);
      ctx.fill(); ctx.stroke();

      let ty = y + CARD_PAD;
      ctx.fillStyle = b.cont ? "#9B9A97" : "#37352F";
      ctx.font = F_MNAME;
      for(const ln of b.nameLines){ ctx.fillText(ln, IMG_PAD + CARD_PAD, ty); ty += LH_MNAME; }
      if(b.descLines.length){
        ty += 14;
        ctx.fillStyle = "#57564F";
        ctx.font = F_MDESC;
        for(const ln of b.descLines){ ctx.fillText(ln, IMG_PAD + CARD_PAD, ty); ty += LH_MDESC; }
      }
      y += b.h + CARD_GAP;
    }

    // 푸터
    ctx.fillStyle = "#9B9A97";
    ctx.font = F_FOOT;
    ctx.fillText(`생성 ${stamp} · 쿠팡이츠 메뉴 설명`, IMG_PAD, H - IMG_PAD - 26);

    return canvas;
  });
}

function canvasToBlob(canvas){
  return new Promise((resolve, reject)=>{
    canvas.toBlob(b => b ? resolve(b) : reject(new Error("이미지 변환 실패")), "image/png");
  });
}

function safeFileName(s){
  return String(s).replace(/[\\/:*?"<>|]/g, "_").slice(0, 60);
}

$("btn-img").addEventListener("click", async ()=>{
  if(!currentStore) return;
  busy(true, "이미지 생성 중…");
  try{
    const canvases = buildImagePages(currentStore);
    const base = safeFileName(currentStore.name || currentStore.id);
    const files = [];
    for(let i=0; i<canvases.length; i++){
      const blob = await canvasToBlob(canvases[i]);
      const name = canvases.length > 1
        ? `${base}_메뉴설명_${i+1}of${canvases.length}.png`
        : `${base}_메뉴설명.png`;
      files.push({ blob, name, url: URL.createObjectURL(blob) });
    }
    showImageModal(files);
  }catch(e){
    toast("이미지 생성 실패: " + (e.message || e));
  }finally{
    busy(false);
  }
});

function showImageModal(files){
  objectUrls.forEach(u=>URL.revokeObjectURL(u));
  objectUrls = files.map(f=>f.url);

  $("modal-title").textContent = files.length > 1 ? `이미지 저장 (${files.length}장)` : "이미지 저장";
  const canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [new File([files[0].blob], files[0].name, { type: "image/png" })] }));

  $("modal-body").innerHTML =
    `<div class="modal-tip">💡 [저장]이 동작하지 않으면 이미지를 <b>길게 눌러</b> '사진에 저장'을 선택하세요.${files.length>1 ? "<br>내용이 길어 " + files.length + "장으로 나눠 생성했습니다." : ""}</div>` +
    files.map((f,i)=>`
      <div class="img-page">
        ${files.length>1 ? `<div class="pg-label">${i+1} / ${files.length}</div>` : ""}
        <img src="${f.url}" alt="메뉴 설명 이미지 ${i+1}">
        <div class="pg-btns">
          <button class="pg-dl" data-i="${i}">⬇️ 저장</button>
          ${canShareFiles ? `<button class="pg-share" data-i="${i}">↗️ 공유</button>` : ""}
        </div>
      </div>`).join("");

  $("modal-body").querySelectorAll(".pg-dl").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const f = files[+btn.dataset.i];
      const a = document.createElement("a");
      a.href = f.url;
      a.download = f.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast("⬇️ 저장을 시작했습니다");
    });
  });
  $("modal-body").querySelectorAll(".pg-share").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const f = files[+btn.dataset.i];
      try{
        await navigator.share({ files: [new File([f.blob], f.name, { type: "image/png" })] });
      }catch(e){ /* 사용자가 취소한 경우 무시 */ }
    });
  });

  $("img-modal").classList.add("show");
}
$("modal-close").addEventListener("click", ()=>$("img-modal").classList.remove("show"));
$("img-modal").addEventListener("click", (e)=>{ if(e.target === $("img-modal")) $("img-modal").classList.remove("show"); });

/* ═══════════ 시작 ═══════════ */
(async function init(){
  const key = getKey();
  if(!key){
    $("gate").classList.add("show");
    return;
  }
  loadData();
})();
</script>
