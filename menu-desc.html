<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="메뉴설명">
<title>메뉴 설명 조회</title>
<style>
  @font-face{font-family:"Pretendard";font-weight:400;font-style:normal;font-display:swap;
    src:url("fonts/Pretendard-Regular.woff2") format("woff2");}
  @font-face{font-family:"Pretendard";font-weight:700;font-style:normal;font-display:swap;
    src:url("fonts/Pretendard-Bold.woff2") format("woff2");}
  @font-face{font-family:"Pretendard";font-weight:800;font-style:normal;font-display:swap;
    src:url("fonts/Pretendard-ExtraBold.woff2") format("woff2");}

  :root{
    color-scheme: light only;
    --ink:#212124; --sub:#8B95A1; --sub2:#6B7684; --body:#454C53;
    --line:#F2F3F5; --line2:#E5E8EB; --band:#F7F8FA;
    --blue:#00A8F0; --blue-press:#0092D6; --blue-tint:#EAF7FE; --blue-deep:#0087C4;
    --orange:#FF6F0F;
    --shell:#EEF1F6;
  }
  @media (prefers-color-scheme: dark){
    html,body{background:var(--shell) !important;color:var(--ink) !important;}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--shell);color:var(--ink);
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",Roboto,"Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }

  /* ── 앱 컨테이너 (모바일 풀블리드, 데스크톱 중앙 480px) ── */
  #app{
    position:relative;height:100dvh;max-width:480px;margin:0 auto;background:#fff;overflow:hidden;
  }
  @media (min-width:520px){
    #app{box-shadow:0 0 0 1px rgba(15,23,42,.07), 0 18px 60px rgba(15,23,42,.16);}
  }

  .screen{
    position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;
    transition:transform .28s cubic-bezier(.32,.72,.35,1);
  }
  #scr-detail{transform:translateX(102%);box-shadow:-12px 0 32px rgba(0,0,0,.08);}
  #app.detail-open #scr-detail{transform:translateX(0);}
  @media (prefers-reduced-motion: reduce){ .screen{transition:none;} }

  .scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  .scroll-wrap{flex:1;position:relative;display:flex;flex-direction:column;overflow:hidden;}

  /* ── 당겨서 새로고침 ── */
  .ptr{position:absolute;top:2px;left:0;right:0;display:flex;justify-content:center;z-index:6;
    pointer-events:none;opacity:0;transform:translateY(-10px);transition:transform .22s, opacity .22s;}
  .ptr .circ{width:42px;height:42px;border-radius:50%;background:rgba(33,33,36,.62);color:#fff;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.22);
    backdrop-filter:blur(4px);}
  .ptr.spin .circ svg{animation:spin .8s linear infinite;}

  /* ── 비밀번호 게이트 ── */
  #gate{position:absolute;inset:0;z-index:100;background:#fff;display:none;align-items:center;justify-content:center;padding:24px;}
  #gate.show{display:flex;}
  .gate-box{width:100%;max-width:320px;text-align:center;}
  .gate-box .emoji{font-size:44px;}
  .gate-box h2{margin:14px 0 4px;font-size:21px;font-weight:800;letter-spacing:-.4px;}
  .gate-box p{margin:0 0 22px;font-size:14px;color:var(--sub);}
  .gate-box input{width:100%;padding:15px 16px;font-size:16px;border:1px solid var(--line2);border-radius:12px;
    background:#fff;text-align:center;letter-spacing:2px;outline:none;font-family:inherit;}
  .gate-box input:focus{border-color:var(--blue);}
  .gate-box button{width:100%;margin-top:10px;padding:16px;font-size:16px;font-weight:700;color:#fff;background:var(--blue);
    border:none;border-radius:12px;cursor:pointer;font-family:inherit;}
  .gate-box button:active{background:var(--blue-press);}
  .gate-err{margin-top:12px;font-size:13.5px;color:var(--orange);min-height:20px;}

  /* ── 목록 화면 ── */
  .home-head{flex-shrink:0;padding:20px 20px 4px;}
  .home-head h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.5px;}
  .home-head p{margin:4px 0 0;font-size:13px;color:var(--sub);}
  .search-wrap{flex-shrink:0;padding:12px 20px 6px;}
  .search-pill{display:flex;align-items:center;gap:10px;border:1px solid var(--line2);border-radius:26px;
    padding:13px 18px;box-shadow:0 2px 10px rgba(33,33,36,.05);background:#fff;}
  .search-pill svg{flex-shrink:0;color:#B0B8C1;}
  .search-pill input{border:none;outline:none;background:none;flex:1;min-width:0;font-size:15px;color:var(--ink);font-family:inherit;}
  .search-pill input::placeholder{color:#B0B8C1;}

  .band{background:var(--band);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;
    font-size:14.5px;font-weight:700;letter-spacing:-.2px;}
  .band .tag{font-size:12.5px;font-weight:700;color:var(--orange);}
  .band .b-left{display:flex;align-items:center;gap:7px;}
  .band.toggle{cursor:pointer;-webkit-user-select:none;user-select:none;}
  .band.toggle:active{background:var(--pill-on,#EDEEF0);}
  .band .caret{color:var(--sub);transition:transform .18s;flex-shrink:0;}
  .band.collapsed .caret{transform:rotate(-90deg);}
  @media (prefers-reduced-motion: reduce){ .band .caret{transition:none;} }

  .store-row{display:flex;align-items:center;gap:14px;padding:17px 20px;cursor:pointer;border-bottom:1px solid var(--line);}
  .store-row:active{background:var(--band);}
  .store-row .thumb{width:46px;height:46px;border-radius:12px;background:var(--blue-tint);color:var(--blue-deep);
    display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;flex-shrink:0;}
  .store-row .info{flex:1;min-width:0;}
  .store-row .name{font-size:16px;font-weight:700;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .store-row .meta{font-size:12.5px;color:var(--sub);margin-top:3px;}
  .store-row .chev{color:#C4CAD4;flex-shrink:0;}
  .list-state{padding:64px 20px;text-align:center;color:var(--sub);font-size:14px;line-height:1.7;}
  .list-state .emoji{font-size:38px;display:block;margin-bottom:10px;}
  .list-state button{margin-top:14px;padding:11px 22px;font-size:14px;font-weight:700;color:var(--ink);
    background:#F2F4F6;border:none;border-radius:10px;cursor:pointer;font-family:inherit;}

  /* ── 상세 화면 ── */
  .appbar{flex-shrink:0;height:54px;display:flex;align-items:center;gap:4px;padding:0 8px;
    background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:5;}
  .appbar .title{position:absolute;left:56px;right:56px;text-align:center;font-size:17px;font-weight:700;letter-spacing:-.3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .icon-btn{width:44px;height:44px;border:none;background:none;border-radius:50%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--ink);}
  .icon-btn:active{background:var(--band);}
  .appbar .spacer{margin-left:auto;}

  .store-head{padding:20px 20px 16px;border-bottom:1px solid var(--line);}
  .store-head h2{margin:0;font-size:21px;font-weight:800;letter-spacing:-.5px;}
  .store-head .meta{margin-top:6px;font-size:13px;color:var(--sub);display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .store-head .meta .dot::before{content:"·";margin-right:6px;color:#C4CAD4;}
  .chip{display:inline-flex;align-items:center;gap:4px;margin-top:10px;background:var(--blue-tint);color:var(--blue-deep);
    font-size:12px;font-weight:700;border-radius:6px;padding:5px 9px;}

  .intro{padding:16px 20px;border-bottom:8px solid var(--band);}
  .intro .label{font-size:12px;font-weight:800;color:var(--blue);margin-bottom:6px;letter-spacing:.2px;}
  .intro .text{font-size:14px;color:var(--sub2);line-height:1.65;white-space:pre-wrap;word-break:break-word;}

  .g-desc-row{padding:13px 20px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--sub);line-height:1.6;
    white-space:pre-wrap;word-break:break-word;}
  .menu-row{padding:17px 20px;border-bottom:1px solid var(--line);}
  .menu-row .m-name{font-size:15.5px;font-weight:700;letter-spacing:-.3px;word-break:break-word;}
  .menu-row .m-desc{font-size:13.5px;color:var(--sub);line-height:1.6;margin-top:5px;white-space:pre-wrap;word-break:break-word;}
  .group-gap{height:8px;background:var(--band);}
  .list-tail{height:100px;}

  /* ── 하단 CTA 바 ── */
  .cta-bar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;gap:9px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, #fff 78%, rgba(255,255,255,0));}
  .btn{border:none;border-radius:10px;cursor:pointer;font-family:inherit;font-size:16px;font-weight:700;
    letter-spacing:-.2px;padding:16px 0;transition:background .12s;}
  .btn:disabled{opacity:.5;}
  .btn-secondary{flex:1;background:#F2F4F6;color:var(--ink);}
  .btn-secondary:active{background:#E5E8EB;}
  .btn-primary{flex:1.6;background:var(--blue);color:#fff;}
  .btn-primary:active{background:var(--blue-press);}

  /* ── 이미지 저장 바텀시트 ── */
  .sheet-dim{position:absolute;inset:0;z-index:20;background:rgba(33,33,36,.5);opacity:0;pointer-events:none;transition:opacity .22s;}
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:20px 20px 0 0;
    display:flex;flex-direction:column;max-height:86%;
    transform:translateY(105%);transition:transform .28s cubic-bezier(.32,.72,.35,1);}
  #app.sheet-open .sheet-dim{opacity:1;pointer-events:auto;}
  #app.sheet-open .sheet{transform:translateY(0);}
  .sheet .handle{width:40px;height:4px;border-radius:2px;background:#E5E8EB;margin:10px auto 4px;flex-shrink:0;}
  .sheet-head{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:6px 20px 10px;}
  .sheet-head h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.3px;}
  .sheet-head button{background:#F2F4F6;border:none;border-radius:50%;width:30px;height:30px;font-size:14px;
    cursor:pointer;color:var(--sub2);font-family:inherit;}
  .sheet-body{overflow-y:auto;padding:0 20px calc(20px + env(safe-area-inset-bottom));}
  .sheet-tip{font-size:12.5px;color:var(--sub2);background:var(--band);border-radius:10px;padding:11px 13px;margin-bottom:14px;line-height:1.55;}
  .img-page{margin-bottom:18px;}
  .img-page .pg-label{font-size:13px;font-weight:700;color:var(--sub2);margin-bottom:6px;}
  .img-page img{width:100%;border:1px solid var(--line2);border-radius:12px;display:block;}
  .img-page .pg-btns{display:flex;gap:8px;margin-top:8px;}
  .img-page .pg-btns button{flex:1;padding:13px;font-size:14px;font-weight:700;border:none;border-radius:10px;cursor:pointer;font-family:inherit;}
  .pg-btns .pg-primary{background:var(--blue);color:#fff;}
  .pg-btns .pg-primary:active{background:var(--blue-press);}
  .pg-btns .pg-secondary{background:#F2F4F6;color:var(--ink);}

  /* ── 토스트 / 로딩 ── */
  .toast{position:absolute;left:50%;bottom:108px;transform:translateX(-50%) translateY(14px);z-index:30;
    background:rgba(33,33,36,.92);color:#fff;font-size:13.5px;font-weight:700;padding:12px 20px;border-radius:24px;
    opacity:0;pointer-events:none;transition:.25s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #busy{position:absolute;inset:0;z-index:80;background:rgba(255,255,255,.8);display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:14px;}
  #busy.show{display:flex;}
  .spinner{width:34px;height:34px;border:3.5px solid var(--blue-tint);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #busy .msg{font-size:14.5px;font-weight:700;color:var(--sub2);}

  button:focus-visible, input:focus-visible, .store-row:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
</style>
</head>
<body>
<div id="app">

  <!-- ═══ 화면 1: 스토어 목록 ═══ -->
  <div class="screen" id="scr-list">
    <div class="home-head">
      <h1>메뉴 설명 조회</h1>
      <p>스토어를 검색하고 메뉴 설명을 저장하세요</p>
    </div>
    <div class="search-wrap">
      <div class="search-pill">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <input id="search-input" type="search" placeholder="스토어 ID 또는 상호명 검색" autocomplete="off">
      </div>
    </div>
    <div class="scroll-wrap">
      <div class="ptr" id="ptr" aria-hidden="true">
        <div class="circ">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </div>
      </div>
      <div class="scroll" id="list-scroll">
        <div id="recent-sec"></div>
        <div class="band toggle" id="band-all" role="button" tabindex="0">
          <span class="b-left">
            <svg class="caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            <span id="band-label">전체 스토어</span>
          </span>
          <span class="tag" id="band-count"></span>
        </div>
        <div id="store-list"><div class="list-state">데이터를 불러오는 중…</div></div>
      </div>
    </div>
  </div>

  <!-- ═══ 화면 2: 스토어 상세 ═══ -->
  <div class="screen" id="scr-detail">
    <div class="appbar">
      <button class="icon-btn" id="btn-back" aria-label="뒤로">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="title" id="d-title"></div>
      <button class="icon-btn spacer" id="btn-share-top" aria-label="공유">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"/><path d="M7.5 7.5L12 3l4.5 4.5"/><path d="M5 12v7a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19v-7"/></svg>
      </button>
    </div>
    <div class="scroll" id="d-scroll">
      <div class="store-head">
        <h2 id="d-name"></h2>
        <div class="meta" id="d-meta"></div>
        <div class="chip">✓ AI 메뉴 설명 제작 완료</div>
      </div>
      <div id="d-body"></div>
      <div class="list-tail"></div>
    </div>
    <div class="cta-bar">
      <button class="btn btn-secondary" id="btn-copy">텍스트 복사</button>
      <button class="btn btn-primary" id="btn-img">이미지 저장</button>
    </div>
  </div>

  <!-- ═══ 이미지 저장 바텀시트 ═══ -->
  <div class="sheet-dim" id="sheet-dim"></div>
  <div class="sheet" id="img-modal">
    <div class="handle"></div>
    <div class="sheet-head">
      <h3 id="modal-title">이미지 저장</h3>
      <button id="modal-close" aria-label="닫기">✕</button>
    </div>
    <div class="sheet-body" id="modal-body"></div>
  </div>

  <!-- 비밀번호 게이트 -->
  <div id="gate">
    <div class="gate-box">
      <div class="emoji">🔐</div>
      <h2>메뉴 설명 조회</h2>
      <p>접속 비밀번호를 입력해주세요</p>
      <input id="gate-input" type="password" inputmode="text" autocomplete="off" placeholder="비밀번호">
      <button id="gate-btn">확인</button>
      <div class="gate-err" id="gate-err"></div>
    </div>
  </div>

  <div id="busy"><div class="spinner"></div><div class="msg" id="busy-msg">처리 중…</div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ═══════════ 설정 ═══════════ */
const SERVER_URL = "https://menu-check-564449764059.asia-northeast3.run.app";
const KEY_STORAGE = "md_access_key";

/* ═══════════ 상태 ═══════════ */
let stores = [];
let currentStore = null;
let objectUrls = [];

const $ = (id)=>document.getElementById(id);
const app = $("app");
const menuCount = (s)=>(s.groups||[]).reduce((a,g)=>a+g.menus.length, 0);

function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}
function busy(on, msg){
  $("busy").classList.toggle("show", !!on);
  if(msg) $("busy-msg").textContent = msg;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* ═══════════ 인증 ═══════════ */
function getKey(){ return localStorage.getItem(KEY_STORAGE) || ""; }

async function verifyKey(key){
  const r = await fetch(SERVER_URL + "/menu-desc/ping", { headers: { "x-access-key": key } });
  return r.ok;
}

async function gateSubmit(){
  const key = $("gate-input").value.trim();
  if(!key) return;
  $("gate-err").textContent = "";
  busy(true, "확인 중…");
  try{
    if(await verifyKey(key)){
      localStorage.setItem(KEY_STORAGE, key);
      $("gate").classList.remove("show");
      loadData();
    }else{
      $("gate-err").textContent = "비밀번호가 올바르지 않습니다.";
    }
  }catch(e){
    $("gate-err").textContent = "서버에 연결할 수 없습니다. 잠시 후 다시 시도해주세요.";
  }finally{
    busy(false);
  }
}
$("gate-btn").addEventListener("click", gateSubmit);
$("gate-input").addEventListener("keydown", e=>{ if(e.key==="Enter") gateSubmit(); });

/* ═══════════ 데이터 로드 ═══════════ */
async function loadData(){
  $("store-list").innerHTML = '<div class="list-state">데이터를 불러오는 중…</div>';
  try{
    const r = await fetch(SERVER_URL + "/menu-desc/data", { headers: { "x-access-key": getKey() } });
    if(r.status === 401){
      localStorage.removeItem(KEY_STORAGE);
      $("gate").classList.add("show");
      return;
    }
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || "HTTP " + r.status);
    stores = (data.stores || []).sort((a,b)=> (b.updatedAt||"").localeCompare(a.updatedAt||""));
    lastFetch = Date.now();
    renderList();
  }catch(e){
    $("store-list").innerHTML = '<div class="list-state"><span class="emoji">⚠️</span>불러오기 실패<br>' +
      escapeHtml(String(e.message||e)) + '<br><button onclick="loadData()">다시 시도</button></div>';
  }
}

/* ═══════════ 목록 & 검색 & 최근 본 스토어 ═══════════ */
const RECENT_KEY = "md_recent_stores";
function getRecents(){
  try{ return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); }catch(e){ return []; }
}
function addRecent(id){
  const list = [id, ...getRecents().filter(x=>x!==id)].slice(0, 5);
  localStorage.setItem(RECENT_KEY, JSON.stringify(list));
}

function rowHtml(s){
  return `
    <div class="store-row" data-id="${escapeHtml(s.id)}" tabindex="0" role="button">
      <div class="thumb">${escapeHtml((s.name||"?").trim().charAt(0))}</div>
      <div class="info">

        <div class="meta">ID ${escapeHtml(s.id)} · 메뉴 ${menuCount(s)}개${s.updatedAt ? " · " + escapeHtml(s.updatedAt.slice(5,10).replace("-",".")) + " 업데이트" : ""}</div>
      </div>

    </div>`;
}
function bindRows(container){

// 섹션 접기/펼치기 상태 (기기에 기억)
const COLLAPSE_KEY = "md_collapsed";
function collapsedState(){
  try{ return JSON.parse(localStorage.getItem(COLLAPSE_KEY) || "{}"); }catch(e){ return {}; }
}
function toggleCollapsed(key){
  const c = collapsedState();
  c[key] = !c[key];
  localStorage.setItem(COLLAPSE_KEY, JSON.stringify(c));
  renderList();
}
const CARET_SVG = '<svg class="caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';

function renderList(){
  const q = $("search-input").value.trim().toLowerCase();
  const filtered = q
    ? stores.filter(s => s.id.toLowerCase().includes(q) || (s.name||"").toLowerCase().includes(q))
    : stores;
  const col = collapsedState();

  // 최근 본 스토어 — 최대 5개, 검색 중에는 숨김
  const recents = q ? [] : getRecents().slice(0, 5).map(id=>stores.find(s=>s.id===id)).filter(Boolean);
  if(recents.length){
    const rc = !!col.recent;
    $("recent-sec").innerHTML =
      `<div class="band toggle${rc ? " collapsed" : ""}" id="band-recent" role="button" tabindex="0">` +
      `<span class="b-left">${CARET_SVG}<span>최근 본 스토어</span></span><span class="tag">${recents.length}개</span></div>` +
      (rc ? "" : recents.map(rowHtml).join(""));
    $("band-recent").addEventListener("click", ()=>toggleCollapsed("recent"));
    bindRows($("recent-sec"));
  }else{
    $("recent-sec").innerHTML = "";
  }

  $("band-label").textContent = q ? "검색 결과" : "전체 스토어";
  $("band-count").textContent = filtered.length + "개";
  const allCollapsed = !q && !!col.all; // 검색 중에는 항상 펼침
  $("band-all").classList.toggle("collapsed", allCollapsed);

  if(filtered.length === 0){
    $("store-list").innerHTML = stores.length === 0
      ? '<div class="list-state"><span class="emoji">📭</span>아직 업로드된 데이터가 없습니다</div>'
      : '<div class="list-state"><span class="emoji">🔍</span>검색 결과가 없어요<br>스토어 ID나 상호명을 다시 확인해주세요</div>';
    return;
  }
  if(allCollapsed){
    $("store-list").innerHTML = "";
    return;
  }
  $("store-list").innerHTML = filtered.slice(0, 200).map(rowHtml).join("");
  bindRows($("store-list"));
}
$("search-input").addEventListener("input", renderList);
$("band-all").addEventListener("click", ()=>{
  if($("search-input").value.trim()) return; // 검색 결과는 접지 않음
  toggleCollapsed("all");
});

/* ═══════════ 당겨서 새로고침 ═══════════ */
let lastFetch = 0;
(function setupPullToRefresh(){
  const sc = $("list-scroll");
  const ptr = $("ptr");
  let startY = null, dist = 0, refreshing = false;
  const THRESHOLD = 60;

  sc.addEventListener("touchstart", (e)=>{
    if(refreshing){ startY = null; return; }
    startY = sc.scrollTop <= 0 ? e.touches[0].clientY : null;
    dist = 0;
  }, { passive: true });

  sc.addEventListener("touchmove", (e)=>{
    if(startY === null || refreshing) return;
    dist = e.touches[0].clientY - startY;
    if(dist > 0 && sc.scrollTop <= 0){
      const d = Math.min(dist * 0.45, 90);
      ptr.style.transition = "none";
      ptr.style.opacity = String(Math.min(d / 46, 1));
      ptr.style.transform = `translateY(${d}px)`;
      ptr.querySelector("svg").style.transform = `rotate(${d * 4}deg)`;
    }
  }, { passive: true });

  sc.addEventListener("touchend", async ()=>{
    if(startY === null || refreshing) return;
    const d = Math.min(Math.max(dist, 0) * 0.45, 90);
    startY = null;
    ptr.style.transition = "";
    if(d >= THRESHOLD){
      refreshing = true;
      ptr.classList.add("spin");
      ptr.style.opacity = "1";
      ptr.style.transform = `translateY(${THRESHOLD}px)`;
      await loadData();
      ptr.classList.remove("spin");
      refreshing = false;
      toast("새로고침 했어요");
    }
    ptr.style.opacity = "0";
    ptr.style.transform = "translateY(-10px)";
  });
})();

// 앱을 오래 벗어났다 돌아오면 자동 새로고침 (3분 경과 시)
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible" && getKey() && lastFetch && Date.now() - lastFetch > 3*60*1000){
    loadData();
  }
});

  $("d-title").textContent = currentStore.name || "(상호명 없음)";
  $("d-name").textContent = currentStore.name || "(상호명 없음)";
  $("d-meta").innerHTML =
    `<span>스토어 ID ${escapeHtml(currentStore.id)}</span>` +
    `<span class="dot">메뉴 ${menuCount(currentStore)}개</span>` +
    (currentStore.updatedAt ? `<span class="dot">${escapeHtml(currentStore.updatedAt.slice(5,10).replace("-","."))} 업데이트</span>` : "");

  let html = "";

    html += `<div class="intro"><div class="label">매장 소개</div><div class="text">${escapeHtml(currentStore.intro)}</div></div>`;
  }
  currentStore.groups.forEach((g, gi)=>{

      html += `<div class="band g-band"><span>${escapeHtml(g.name || "기타")}</span><span class="tag">메뉴 ${g.menus.length}개</span></div>`;
      if(g.desc) html += `<div class="g-desc-row">${escapeHtml(g.desc)}</div>`;

        m.desc ? `<div class="m-desc">${escapeHtml(m.desc)}</div>` : ""}</div>`;

// 단위(헤더/소개/그룹/디쉬)마다 빈 줄 하나로 구분 — 어디에 붙여넣어도 읽기 좋게
function buildText(store){
  const parts = [];
  parts.push(
    `■ ${store.name || "(상호명 없음)"} (스토어 ID: ${store.id})\n` +
    `메뉴 설명 ${menuCount(store)}개${store.updatedAt ? " · 업데이트 " + store.updatedAt.slice(0,10) : ""}`
  );
  if(store.intro) parts.push(store.intro);
  for(const g of store.groups){
    if(g.name || g.desc){
      parts.push(`[${g.name || "기타"}]` + (g.desc ? "\n" + g.desc : ""));
    }
    for(const m of g.menus){
      parts.push(m.name + (m.desc ? "\n" + m.desc : ""));
    }
  }
  return parts.join("\n\n");
}

async function copyText(text){
  try{
    await navigator.clipboard.writeText(text);
    return true;
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;left:-9999px;top:0;";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch(e2){}
    ta.remove();
    return ok;
  }
}

$("btn-copy").addEventListener("click", async ()=>{
  if(!currentStore) return;
  const ok = await copyText(buildText(currentStore));
  toast(ok ? "전체 메뉴 설명이 복사됐어요" : "복사에 실패했습니다");
});

$("btn-share-top").addEventListener("click", async ()=>{
  if(!currentStore) return;
  const text = buildText(currentStore);
  if(navigator.share){
    try{ await navigator.share({ text }); }catch(e){ /* 취소 시 무시 */ }
  }else{
    const ok = await copyText(text);
    toast(ok ? "공유 대신 텍스트를 복사했어요" : "복사에 실패했습니다");
  }
});

/* ═══════════ 이미지 생성 (캔버스 직접 렌더링, 쿠팡이츠 스타일) ═══════════
   스토어 전체 내용을 흰 배경 리스트 스타일로 그린다.
   기기 캔버스 한계를 넘으면 블록 경계에서 자동 분할. */
const IMG_W = 1080;
const PAD = 64;
const MAX_PAGE_H = 11000;

const FONT_STACK = '"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const F_TITLE = '800 50px ' + FONT_STACK;
const F_META  = '400 27px ' + FONT_STACK;
const F_ITAG  = '800 25px ' + FONT_STACK;
const F_INTRO = '400 29px ' + FONT_STACK;
const F_GNAME = '700 33px ' + FONT_STACK;
const F_GCNT  = '700 26px ' + FONT_STACK;
const F_GDESC = '400 27px ' + FONT_STACK;
const F_MNAME = '700 33px ' + FONT_STACK;
const F_MDESC = '400 28px ' + FONT_STACK;
const F_FOOT  = '400 22px ' + FONT_STACK;
const LH_TITLE=64, LH_INTRO=47, LH_GDESC=44, LH_MNAME=46, LH_MDESC=45;

const C_INK="#212124", C_SUB="#8B95A1", C_BODY="#454C53", C_LINE="#F2F3F5",
      C_BAND="#F7F8FA", C_BLUE="#00A8F0", C_ORANGE="#FF6F0F", C_FAINT="#B0B8C1";

function wrapText(ctx, text, font, maxW){
  ctx.font = font;
  const out = [];
  for(const para of String(text).split("\n")){
    if(para === ""){ out.push(""); continue; }
    let line = "";
    for(const word of para.split(" ")){
      const tryLine = line ? line + " " + word : word;
      if(ctx.measureText(tryLine).width <= maxW){ line = tryLine; continue; }
      if(line) out.push(line);
      if(ctx.measureText(word).width > maxW){
        let chunk = "";
        for(const ch of word){
          if(ctx.measureText(chunk + ch).width > maxW){ out.push(chunk); chunk = ch; }
          else chunk += ch;
        }
        line = chunk;
      }else{
        line = word;
      }
    }
    out.push(line);
  }
  return out;
}

function buildImagePages(store){
  const measure = document.createElement("canvas").getContext("2d");
  const innerW = IMG_W - PAD*2;
  const maxBlockH = MAX_PAGE_H - PAD*2 - 240;

  // ── 블록 구성 (소개 / 그룹밴드 / 그룹설명 / 메뉴) ──
  const blocks = [];
  if(store.intro){
    const lines = wrapText(measure, store.intro, F_INTRO, innerW);
    blocks.push({ kind:"intro", lines, h: 30 + 40 + lines.length*LH_INTRO + 30 + 14 });
  }
  for(const g of store.groups){
    if(g.name || g.desc){
      blocks.push({ kind:"gband", name: g.name || "기타", count: g.menus.length, h: 88 });
      if(g.desc){
        const lines = wrapText(measure, g.desc, F_GDESC, innerW);
        blocks.push({ kind:"gdesc", lines, h: 24 + lines.length*LH_GDESC + 24 });
      }
    }
    for(const m of g.menus){
      const nameLines = wrapText(measure, m.name, F_MNAME, innerW);
      const descLines = m.desc ? wrapText(measure, m.desc, F_MDESC, innerW) : [];
      const makeBlock = (nl, dl, cont)=>({
        kind:"menu", nameLines: nl, descLines: dl, cont,
        h: 32 + nl.length*LH_MNAME + (dl.length ? 10 + dl.length*LH_MDESC : 0) + 32,
      });
      const block = makeBlock(nameLines, descLines, false);
      if(block.h <= maxBlockH){
        blocks.push(block);
      }else{
        const headH = 32 + nameLines.length*LH_MNAME + 10;
        const perPage = Math.max(5, Math.floor((maxBlockH - headH) / LH_MDESC));
        for(let s=0; s<descLines.length; s+=perPage){
          blocks.push(makeBlock(
            s===0 ? nameLines : wrapText(measure, m.name + " (이어서)", F_MNAME, innerW),
            descLines.slice(s, s+perPage), s>0));
        }
      }
    }
  }

  // ── 페이지 배분 ──
  const titleLines = wrapText(measure, store.name || "(상호명 없음)", F_TITLE, innerW);
  const headerH = titleLines.length*LH_TITLE + 14 + 34 + 28 + 2 + 8;
  const FOOT_H = 76;

  const pages = [];
  let cur = [], curH = PAD + headerH;
  for(const b of blocks){
    if(cur.length && curH + b.h > MAX_PAGE_H - PAD - FOOT_H){
      pages.push(cur); cur = []; curH = PAD + headerH;
    }
    cur.push(b); curH += b.h;
  }
  if(cur.length) pages.push(cur);
  if(pages.length === 0) pages.push([]);

  // ── 렌더링 ──
  const now = new Date();
  const stamp = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")} ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
  const totalMenus = menuCount(store);

  return pages.map((pageBlocks, pi)=>{
    const contentH = pageBlocks.reduce((a,b)=>a + b.h, 0);
    const H = PAD + headerH + contentH + FOOT_H + PAD;
    const canvas = document.createElement("canvas");
    canvas.width = IMG_W;
    canvas.height = H;
    const ctx = canvas.getContext("2d");

    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, IMG_W, H);
    ctx.textBaseline = "top";

    // 헤더
    let y = PAD;
    ctx.fillStyle = C_INK;
    ctx.font = F_TITLE;
    for(const ln of titleLines){ ctx.fillText(ln, PAD, y); y += LH_TITLE; }
    y += 14;
    ctx.fillStyle = C_SUB;
    ctx.font = F_META;
    const meta = [`스토어 ID ${store.id}`, `메뉴 ${totalMenus}개`];
    if(store.updatedAt) meta.push(`업데이트 ${store.updatedAt.slice(0,10)}`);
    if(pages.length > 1) meta.push(`${pi+1}/${pages.length} 페이지`);
    ctx.fillText(meta.join("  ·  "), PAD, y);
    y += 34 + 28;
    ctx.fillStyle = C_LINE;
    ctx.fillRect(PAD, y, innerW, 2);
    y += 2 + 8;

    // 블록
    for(const b of pageBlocks){
      if(b.kind === "intro"){
        let ty = y + 30;
        ctx.fillStyle = C_BLUE;
        ctx.font = F_ITAG;
        ctx.fillText("매장 소개", PAD, ty);
        ty += 40;
        ctx.fillStyle = C_BODY;
        ctx.font = F_INTRO;
        for(const ln of b.lines){ ctx.fillText(ln, PAD, ty); ty += LH_INTRO; }
        ctx.fillStyle = C_BAND;
        ctx.fillRect(0, y + b.h - 14, IMG_W, 14);
      }else if(b.kind === "gband"){
        ctx.fillStyle = C_BAND;
        ctx.fillRect(0, y, IMG_W, b.h);
        ctx.fillStyle = C_INK;
        ctx.font = F_GNAME;
        ctx.fillText(b.name, PAD, y + 28);
        ctx.fillStyle = C_ORANGE;
        ctx.font = F_GCNT;
        ctx.textAlign = "right";
        ctx.fillText(`메뉴 ${b.count}개`, IMG_W - PAD, y + 32);
        ctx.textAlign = "left";
      }else if(b.kind === "gdesc"){
        let ty = y + 24;
        ctx.fillStyle = C_SUB;
        ctx.font = F_GDESC;
        for(const ln of b.lines){ ctx.fillText(ln, PAD, ty); ty += LH_GDESC; }
        ctx.fillStyle = C_LINE;
        ctx.fillRect(PAD, y + b.h - 2, innerW, 2);
      }else{ // menu
        let ty = y + 32;
        ctx.fillStyle = b.cont ? C_SUB : C_INK;
        ctx.font = F_MNAME;
        for(const ln of b.nameLines){ ctx.fillText(ln, PAD, ty); ty += LH_MNAME; }
        if(b.descLines.length){
          ty += 10;
          ctx.fillStyle = C_SUB;
          ctx.font = F_MDESC;
          for(const ln of b.descLines){ ctx.fillText(ln, PAD, ty); ty += LH_MDESC; }
        }
        ctx.fillStyle = C_LINE;
        ctx.fillRect(PAD, y + b.h - 2, innerW, 2);
      }
      y += b.h;
    }

    // 푸터
    ctx.fillStyle = C_FAINT;
    ctx.font = F_FOOT;
    ctx.fillText(`생성 ${stamp} · 쿠팡이츠 메뉴 설명`, PAD, H - PAD - 26);

    return canvas;
  });
}

function canvasToBlob(canvas){
  return new Promise((resolve, reject)=>{
    canvas.toBlob(b => b ? resolve(b) : reject(new Error("이미지 변환 실패")), "image/png");
  });
}

function safeFileName(s){
  return String(s).replace(/[\\/:*?"<>|]/g, "_").slice(0, 60);
}

$("btn-img").addEventListener("click", async ()=>{
  if(!currentStore) return;
  busy(true, "이미지 생성 중…");
  try{
    // 캔버스가 Pretendard로 그려지도록 폰트 로드를 보장
    try{
      await Promise.all([
        document.fonts.load('400 28px Pretendard', "한글Aa1"),
        document.fonts.load('700 33px Pretendard', "한글Aa1"),
        document.fonts.load('800 50px Pretendard', "한글Aa1"),
      ]);
    }catch(e){ /* 폰트 로드 실패 시 시스템 폰트로 대체 */ }

    const canvases = buildImagePages(currentStore);
    const base = safeFileName(currentStore.name || currentStore.id);
    const files = [];
    for(let i=0; i<canvases.length; i++){
      const blob = await canvasToBlob(canvases[i]);
      const name = canvases.length > 1
        ? `${base}_메뉴설명_${i+1}of${canvases.length}.png`
        : `${base}_메뉴설명.png`;
      files.push({ blob, name, url: URL.createObjectURL(blob) });
    }
    showImageSheet(files);
  }catch(e){
    toast("이미지 생성 실패: " + (e.message || e));
  }finally{
    busy(false);
  }
});

function showImageSheet(files){
  objectUrls.forEach(u=>URL.revokeObjectURL(u));
  objectUrls = files.map(f=>f.url);

  $("modal-title").textContent = files.length > 1 ? `이미지 저장 (${files.length}장)` : "이미지 저장";
  const canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [new File([files[0].blob], files[0].name, { type: "image/png" })] }));

  const tip = canShareFiles
    ? `💡 <b>[사진에 저장]</b> → 뜨는 창에서 <b>'이미지 저장'</b>을 누르면 사진첩에 바로 들어가요.`
    : `💡 [저장]이 동작하지 않으면 이미지를 <b>길게 눌러</b> '사진에 저장'을 선택하세요.`;
  $("modal-body").innerHTML =
    `<div class="sheet-tip">${tip}${
      files.length>1 ? "<br>내용이 길어 " + files.length + "장으로 나눠 생성했어요." : ""}</div>` +
    files.map((f,i)=>`
      <div class="img-page">
        ${files.length>1 ? `<div class="pg-label">${i+1} / ${files.length}</div>` : ""}
        <img src="${f.url}" alt="메뉴 설명 이미지 ${i+1}">
        <div class="pg-btns">
          ${canShareFiles
            ? `<button class="pg-share pg-primary" data-i="${i}">사진에 저장</button>
               <button class="pg-dl pg-secondary" data-i="${i}">파일로 저장</button>`
            : `<button class="pg-dl pg-primary" data-i="${i}">저장</button>`}
        </div>
      </div>`).join("");

  $("modal-body").querySelectorAll(".pg-dl").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const f = files[+btn.dataset.i];
      const a = document.createElement("a");
      a.href = f.url;
      a.download = f.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast("저장을 시작했어요");
    });
  });
  $("modal-body").querySelectorAll(".pg-share").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const f = files[+btn.dataset.i];
      try{
        await navigator.share({ files: [new File([f.blob], f.name, { type: "image/png" })] });
      }catch(e){ /* 사용자가 취소한 경우 무시 */ }
    });
  });

  $("img-modal").classList.add("show");
  app.classList.add("sheet-open");
  $("modal-body").scrollTop = 0;
}
function closeSheet(){
  $("img-modal").classList.remove("show");
  app.classList.remove("sheet-open");
}
$("modal-close").addEventListener("click", closeSheet);
$("sheet-dim").addEventListener("click", closeSheet);

(async function init(){
  const key = getKey();
  if(!key){
    $("gate").classList.add("show");
    return;
  }
  loadData();
})();
</script>
